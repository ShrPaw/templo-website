<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="halo" cx="72%" cy="32%" r="28%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#a8854a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="base-glow" cx="72%" cy="85%" r="30%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="left-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#0a0a0a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="statue-body" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2a2520"/>
      <stop offset="40%" stop-color="#1a1815"/>
      <stop offset="100%" stop-color="#0f0e0c"/>
    </radialGradient>
    <radialGradient id="statue-highlight" cx="65%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Base dark background -->
  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <!-- Subtle architectural floor line -->
  <line x1="0" y1="780" x2="1920" y2="780" stroke="#1a1815" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="782" x2="1920" y2="782" stroke="#c9a96e" stroke-width="0.3" opacity="0.08"/>

  <!-- Architectural vertical lines (subtle) -->
  <line x1="1200" y1="0" x2="1200" y2="780" stroke="#1a1815" stroke-width="0.4" opacity="0.3"/>
  <line x1="1500" y1="0" x2="1500" y2="780" stroke="#1a1815" stroke-width="0.4" opacity="0.2"/>

  <!-- Halo / architectural circle behind head -->
  <circle cx="1380" cy="260" r="220" fill="none" stroke="#c9a96e" stroke-width="0.8" opacity="0.12"/>
  <circle cx="1380" cy="260" r="200" fill="none" stroke="#c9a96e" stroke-width="0.3" opacity="0.06"/>
  <circle cx="1380" cy="260" r="180" fill="url(#halo)" opacity="0.5"/>

  <!-- Warm ambient glow behind statue -->
  <ellipse cx="1380" cy="400" rx="300" ry="400" fill="url(#halo)" opacity="0.4"/>

  <!-- === BUDDHA STATUE (dark sculptural silhouette) === -->
  <g transform="translate(1200, 100)" opacity="0.95">
    <!-- Base / pedestal -->
    <rect x="60" y="620" width="280" height="60" rx="4" fill="#151311" stroke="#1a1815" stroke-width="0.5"/>
    <rect x="80" y="610" width="240" height="15" rx="2" fill="#1a1815"/>

    <!-- Seated body / robes -->
    <path d="M120 610 Q100 480 130 380 Q150 300 200 260 Q230 240 250 235 Q280 230 310 240 Q350 260 370 320 Q390 380 400 480 Q410 560 380 610 Z"
          fill="url(#statue-body)" stroke="#2a2520" stroke-width="0.5"/>

    <!-- Robe folds (subtle dark lines) -->
    <path d="M160 400 Q200 380 240 420 Q260 440 250 480" fill="none" stroke="#2a2520" stroke-width="1" opacity="0.5"/>
    <path d="M180 450 Q220 430 260 470 Q280 500 270 540" fill="none" stroke="#2a2520" stroke-width="0.8" opacity="0.4"/>
    <path d="M300 350 Q330 380 350 430 Q360 470 350 520" fill="none" stroke="#1a1815" stroke-width="0.8" opacity="0.3"/>
    <path d="M140 500 Q180 480 220 510 Q240 530 230 560" fill="none" stroke="#2a2520" stroke-width="0.6" opacity="0.4"/>

    <!-- Crossed legs (lotus position) -->
    <path d="M120 610 Q140 580 200 570 Q260 565 320 575 Q360 585 380 610"
          fill="#151311" stroke="#1a1815" stroke-width="0.5"/>

    <!-- Shoulders -->
    <path d="M160 310 Q180 280 220 265 Q250 255 280 260 Q320 275 340 310"
          fill="url(#statue-body)" stroke="#2a2520" stroke-width="0.5"/>

    <!-- Head -->
    <ellipse cx="250" cy="220" rx="52" ry="60" fill="#1a1815"/>
    <ellipse cx="250" cy="215" rx="48" ry="55" fill="#1d1b18"/>

    <!-- Ushnisha (top knot/crown) -->
    <ellipse cx="250" cy="160" rx="28" ry="32" fill="#1a1815"/>
    <ellipse cx="250" cy="155" rx="22" ry="26" fill="#1d1b18"/>
    <circle cx="250" cy="140" r="10" fill="#1a1815"/>

    <!-- Face features (minimal, sculptural) -->
    <!-- Closed eyes -->
    <path d="M230 215 Q237 210 245 215" fill="none" stroke="#2a2520" stroke-width="1" opacity="0.6"/>
    <path d="M255 215 Q263 210 270 215" fill="none" stroke="#2a2520" stroke-width="1" opacity="0.6"/>
    <!-- Nose -->
    <path d="M248 218 L250 230 L252 228" fill="none" stroke="#2a2520" stroke-width="0.6" opacity="0.4"/>
    <!-- Lips -->
    <path d="M242 238 Q250 242 258 238" fill="none" stroke="#2a2520" stroke-width="0.8" opacity="0.4"/>
    <!-- Elongated earlobes -->
    <path d="M200 220 Q195 240 198 260" fill="none" stroke="#2a2520" stroke-width="1" opacity="0.4"/>
    <path d="M300 220 Q305 240 302 260" fill="none" stroke="#2a2520" stroke-width="1" opacity="0.4"/>

    <!-- Arms / hands in lap (dhyana mudra) -->
    <path d="M180 420 Q200 400 240 395 Q280 392 320 400 Q340 410 350 420"
          fill="#151311" stroke="#1a1815" stroke-width="0.5"/>
    <ellipse cx="260" cy="410" rx="50" ry="15" fill="#1a1815" opacity="0.5"/>

    <!-- Rim light (warm gold edge) -->
    <path d="M310 260 Q340 300 360 360 Q380 440 380 520 Q380 580 370 610"
          fill="none" stroke="#c9a96e" stroke-width="0.6" opacity="0.15" filter="url(#soft)"/>
    <path d="M200 250 Q175 280 160 320 Q140 380 130 450"
          fill="none" stroke="#c9a96e" stroke-width="0.4" opacity="0.08" filter="url(#soft)"/>

    <!-- Subtle golden highlight on face/halo -->
    <ellipse cx="250" cy="200" rx="60" ry="70" fill="url(#statue-highlight)"/>
  </g>

  <!-- Ambient particles / dust (subtle) -->
  <circle cx="800" cy="300" r="1" fill="#c9a96e" opacity="0.15"/>
  <circle cx="900" cy="500" r="0.8" fill="#c9a96e" opacity="0.1"/>
  <circle cx="1100" cy="200" r="1.2" fill="#c9a96e" opacity="0.12"/>
  <circle cx="700" cy="600" r="0.6" fill="#c9a96e" opacity="0.08"/>
  <circle cx="1000" cy="400" r="0.9" fill="#c9a96e" opacity="0.1"/>
  <circle cx="1300" cy="700" r="0.7" fill="#c9a96e" opacity="0.06"/>

  <!-- Base warm glow -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#base-glow)" opacity="0.3"/>

  <!-- Left side darkening (for text overlay) -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#left-fade)"/>

  <!-- Bottom vignette -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#vignette)"/>
</svg>
